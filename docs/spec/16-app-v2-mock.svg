<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" font-family="Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="1240" height="680" fill="#1b1f24"/>
  <text x="20" y="24" fill="#e5e7eb" font-size="16" font-weight="700">Garage app v2 — main screen states (schematic mock, not final art)</text>

  <!-- ================= FRAME 1: CLOSED (X=20) ================= -->
  <g>
    <text x="160" y="48" fill="#9ca3af" font-size="13" text-anchor="middle">CLOSED</text>
    <rect x="20" y="56" width="280" height="600" rx="30" fill="#111418" stroke="#2a2f37" stroke-width="2"/>
    <!-- app bar -->
    <text x="42" y="96" fill="#e5e7eb" font-size="16" font-weight="700">▦ GARAGE</text>
    <circle cx="270" cy="90" r="10" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="270" cy="90" r="3.5" fill="#9ca3af"/>
    <!-- door: closed (panel fills opening) -->
    <rect x="110" y="150" width="100" height="140" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <line x1="110" y1="185" x2="210" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <line x1="110" y1="220" x2="210" y2="220" stroke="#94a3b8" stroke-width="2"/>
    <line x1="110" y1="255" x2="210" y2="255" stroke="#94a3b8" stroke-width="2"/>
    <!-- labels -->
    <text x="160" y="352" fill="#e5e7eb" font-size="26" font-weight="700" text-anchor="middle">Closed</text>
    <text x="160" y="378" fill="#9ca3af" font-size="13" text-anchor="middle">Closed since 09:14</text>
    <!-- action button: Open (primary) -->
    <rect x="54" y="496" width="212" height="58" rx="16" fill="#2563eb"/>
    <text x="160" y="532" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">▲  Open</text>
    <!-- footer + log -->
    <text x="54" y="600" fill="#9ca3af" font-size="12">Wi-Fi · direct    live</text>
    <text x="54" y="620" fill="#4b5563" font-size="11">09:02   Wi-Fi · direct</text>
    <text x="54" y="636" fill="#4b5563" font-size="11">08:55   Wi-Fi · broker</text>
  </g>

  <!-- ================= FRAME 2: OPENING (X=320) ================= -->
  <g>
    <text x="460" y="48" fill="#9ca3af" font-size="13" text-anchor="middle">OPENING</text>
    <rect x="320" y="56" width="280" height="600" rx="30" fill="#111418" stroke="#2a2f37" stroke-width="2"/>
    <text x="342" y="96" fill="#e5e7eb" font-size="16" font-weight="700">▦ GARAGE</text>
    <circle cx="570" cy="90" r="10" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="570" cy="90" r="3.5" fill="#9ca3af"/>
    <!-- door: opening (dark opening above, panel lower) + up arrows -->
    <rect x="410" y="150" width="100" height="140" fill="#0b0d10" stroke="#64748b" stroke-width="2"/>
    <rect x="410" y="230" width="100" height="60" fill="#cbd5e1"/>
    <line x1="410" y1="260" x2="510" y2="260" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="460,165 450,180 470,180" fill="#38bdf8"/>
    <polygon points="460,185 450,200 470,200" fill="#38bdf8" opacity="0.7"/>
    <polygon points="460,205 450,220 470,220" fill="#38bdf8" opacity="0.4"/>
    <text x="460" y="352" fill="#e5e7eb" font-size="26" font-weight="700" text-anchor="middle">Opening…</text>
    <text x="460" y="378" fill="#9ca3af" font-size="13" text-anchor="middle">in motion</text>
    <!-- action button: Stop (caution) -->
    <rect x="354" y="496" width="212" height="58" rx="16" fill="#d97706"/>
    <text x="460" y="532" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">■  Stop</text>
    <text x="354" y="600" fill="#9ca3af" font-size="12">Wi-Fi · direct    live</text>
    <text x="354" y="620" fill="#4b5563" font-size="11">09:02   Wi-Fi · direct</text>
  </g>

  <!-- ================= FRAME 3: OPEN (X=620) ================= -->
  <g>
    <text x="760" y="48" fill="#9ca3af" font-size="13" text-anchor="middle">OPEN</text>
    <rect x="620" y="56" width="280" height="600" rx="30" fill="#111418" stroke="#2a2f37" stroke-width="2"/>
    <text x="642" y="96" fill="#e5e7eb" font-size="16" font-weight="700">▦ GARAGE</text>
    <circle cx="870" cy="90" r="10" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="870" cy="90" r="3.5" fill="#9ca3af"/>
    <!-- door: open (panel rolled to a thin header) -->
    <rect x="710" y="150" width="100" height="140" fill="#0b0d10" stroke="#64748b" stroke-width="2"/>
    <rect x="710" y="150" width="100" height="22" fill="#cbd5e1"/>
    <text x="760" y="352" fill="#e5e7eb" font-size="26" font-weight="700" text-anchor="middle">Open</text>
    <text x="760" y="378" fill="#9ca3af" font-size="13" text-anchor="middle">Open for 12 min</text>
    <!-- action button: Close (primary) -->
    <rect x="654" y="496" width="212" height="58" rx="16" fill="#2563eb"/>
    <text x="760" y="532" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">▼  Close</text>
    <text x="654" y="600" fill="#9ca3af" font-size="12">Cloud    updated 4s ago</text>
    <text x="654" y="620" fill="#4b5563" font-size="11">09:41   Cloud</text>
    <text x="654" y="636" fill="#4b5563" font-size="11">09:02   Wi-Fi · direct</text>
  </g>

  <!-- ================= FRAME 4: STOPPED (split pair) (X=920) ================= -->
  <g>
    <text x="1060" y="48" fill="#9ca3af" font-size="13" text-anchor="middle">STOPPED (split pair)</text>
    <rect x="920" y="56" width="280" height="600" rx="30" fill="#111418" stroke="#2a2f37" stroke-width="2"/>
    <text x="942" y="96" fill="#e5e7eb" font-size="16" font-weight="700">▦ GARAGE</text>
    <circle cx="1170" cy="90" r="10" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="1170" cy="90" r="3.5" fill="#9ca3af"/>
    <!-- door: stopped partway (panel mid, halted) + pause marker -->
    <rect x="1010" y="150" width="100" height="140" fill="#0b0d10" stroke="#64748b" stroke-width="2"/>
    <rect x="1010" y="222" width="100" height="68" fill="#cbd5e1"/>
    <line x1="1010" y1="256" x2="1110" y2="256" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1052" y="178" width="6" height="20" fill="#d97706"/>
    <rect x="1062" y="178" width="6" height="20" fill="#d97706"/>
    <text x="1060" y="352" fill="#e5e7eb" font-size="26" font-weight="700" text-anchor="middle">Stopped</text>
    <text x="1060" y="378" fill="#9ca3af" font-size="13" text-anchor="middle">Stopped while opening</text>
    <!-- action: ONE wide button split by a divider into Open | Close -->
    <rect x="954" y="496" width="212" height="58" rx="16" fill="#2563eb"/>
    <line x1="1060" y1="500" x2="1060" y2="550" stroke="#1e3a8a" stroke-width="2"/>
    <text x="1007" y="532" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">▲ Open</text>
    <text x="1113" y="532" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">Close ▼</text>
    <text x="954" y="600" fill="#9ca3af" font-size="12">Wi-Fi · broker    live</text>
    <text x="954" y="620" fill="#4b5563" font-size="11">09:38   Wi-Fi · broker</text>
  </g>
</svg>
