<body class="bg-background text-on-background h-screen flex flex-col overflow-hidden font-body-lg">
<!-- Identity Band: TopAppBar -->
<header class="flex justify-between items-center px-margin-edge h-16 w-full bg-surface shrink-0 z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<h1 class="font-headline-md text-headline-md font-black tracking-tighter text-on-surface">GARAGE</h1>
</div>
<button aria-label="Settings" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant/20 transition-colors text-on-surface-variant focus:outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative">
<!-- State Band: Center 50% -->
<section class="flex-1 flex flex-col items-center justify-center p-band-padding min-h-0 relative z-0">
<!-- Schematic Card -->
<div class="w-64 h-64 md:w-80 md:h-80 mb-8 relative overflow-hidden rounded-lg shadow-lg border border-outline-variant">
<img alt="Garage Door Closed" class="absolute inset-0 w-[200%] h-[200%] object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBN2BKXev7JHGtgDC648tnudh48i33atf5pkTn1uZJxDt-4PCutvMYAHaLYpczCnDq4hiflvhFnBP64W905SJ8ueK3Cb_MuIHxSRqdSscJgHpQlBR77Fkbn35hLXmxghzd-D3EIGa9wtaUn19NSf19bMsMG2QQbWlZvm_AJl3YCouas4ZXveXsd5HibNZ8RDuCusMCdf_goa0iMR8Gba9cb6SXPC0QZ5rugOSM57NXr_QXzztc_X8zfFXTeDhptjn5lygl13vCgo9Q" style="object-position: 0% 0%;"/>
</div>
<!-- State Text -->
<div class="text-center flex flex-col gap-2">
<h2 class="font-display-state text-display-state md:hidden text-on-surface">Closed</h2>
<h2 class="font-display-state text-display-state hidden md:block text-on-surface">Closed</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Closed since 09:14</p>
</div>
</section>
<!-- Action Band: Bottom 40% -->
<section class="shrink-0 p-margin-edge pb-band-padding flex flex-col gap-gutter-v z-10 bg-gradient-to-t from-background via-background to-transparent">
<!-- Primary Action Button -->
<button aria-label="Open Garage Door" class="w-full h-16 bg-primary-container rounded-full flex items-center justify-center gap-2 hover:bg-primary-fixed transition-all duration-300 active:scale-95 glow-effect group font-black black text-black">
<span class="material-symbols-outlined text-[32px] group-hover:-translate-y-1 transition-transform" style="font-variation-settings: 'FILL' 1;">arrow_drop_up</span>
<span class="font-headline-md text-headline-md">Open</span>
</button>
<!-- Technical Logs & Status -->
<div class="flex flex-col gap-stack-tight px-4 mt-4">
<!-- Current Status Chip -->
<div class="flex items-center gap-2 font-label-mono text-label-mono text-on-surface-variant mb-2">
<span class="w-2 h-2 rounded-full bg-[#00ff00] animate-pulse"></span>
<span>Wi-Fi · direct live</span>
</div>
<!-- Muted Log Rows -->
<div class="flex flex-col gap-1 max-h-24 overflow-y-auto custom-scrollbar pr-2 mask-image: linear-gradient(to bottom, black 50%, transparent 100%);">
<div class="font-label-mono text-label-mono text-outline flex gap-3">
<span class="opacity-70">09:02</span>
<span>Wi-Fi · direct</span>
</div>
<div class="font-label-mono text-label-mono text-outline flex gap-3">
<span class="opacity-70">08:55</span>
<span>Wi-Fi · broker</span>
</div>
<div class="font-label-mono text-label-mono text-outline flex gap-3">
<span class="opacity-70">08:12</span>

</div>
</div>
