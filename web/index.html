<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Garage control</title>
<link rel="icon" href="data:," />
<style>
  /* Cyber Garage Control — mirrors the app theme (docs/visual_design_ideas/.../DESIGN.md). Dark-only neon. */
  :root {
    --bg:#0a0a0a; --s1:#121212; --s2:#1c1c1c; --line:#2c2c2c; --fg:#e5e2e1; --mut:#b9cacb;
    --cyan:#00f2ff; --oncyan:#00363a; --orange:#ff9500; --onorange:#4b2800; --green:#3fd16b; --red:#ff6b6b;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:system-ui,"Roboto Flex",Segoe UI,Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--sans); background:var(--bg); color:var(--fg);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .wrap { width:100%; max-width:460px; min-height:100vh; padding:16px 24px; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:8px 0 4px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand h1 { font-size:24px; margin:0; font-weight:700; letter-spacing:1px; }
  .gear { background:none; border:none; color:var(--mut); font-size:24px; cursor:pointer; padding:6px; }

  .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  #door { width:200px; height:170px; }
  /* door panel slides; motion states loop indeterminately (we know direction, not position) */
  #door .panel { transition:transform .5s ease; }
  #door.s-closed  .panel { transform:translateY(0); }
  #door.s-open    .panel { transform:translateY(-96px); }
  #door.s-stopped .panel { transform:translateY(-58px); }
  #door.s-unknown { opacity:.35; }
  #door.s-opening .panel { animation:doorRise 1.7s ease-in-out infinite; }
  #door.s-closing .panel { animation:doorFall 1.7s ease-in-out infinite; }
  @keyframes doorRise { 0%{transform:translateY(-6px)} 100%{transform:translateY(-96px)} }
  @keyframes doorFall { 0%{transform:translateY(-96px)} 100%{transform:translateY(-6px)} }
  /* travel-direction chevrons (cyan), flowing; flipped for closing */
  #door .chevs { opacity:0; transition:opacity .3s; }
  #door.s-opening .chevs, #door.s-closing .chevs { opacity:1; }
  #door.s-closing .chevs { transform:scaleY(-1); transform-box:fill-box; transform-origin:center; }
  #door.s-opening .c1, #door.s-closing .c1 { animation:chevFlow 1.2s linear infinite; }
  #door.s-opening .c2, #door.s-closing .c2 { animation:chevFlow 1.2s linear infinite .2s; }
  #door.s-opening .c3, #door.s-closing .c3 { animation:chevFlow 1.2s linear infinite .4s; }
  @keyframes chevFlow { 0%,100%{opacity:.12} 45%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { #door .panel, #door .chevs polyline { animation:none !important; } }
  .state { font-size:40px; font-weight:700; text-align:center; margin-top:14px; }
  .state.stopped { color:var(--orange); }
  .sub { font-family:var(--mono); font-size:12px; color:var(--mut); letter-spacing:.5px; }
  .stamp { margin-top:18px; transform:rotate(-6deg); border:2px solid rgba(255,149,0,.85);
           border-radius:10px; padding:8px 18px; text-align:center; display:none; }
  .stamp.on { display:block; }
  .stamp b { color:var(--orange); font-size:20px; letter-spacing:1px; }
  .stamp span { display:block; font-family:var(--mono); font-size:10px; color:rgba(255,149,0,.7); }

  /* action band */
  .action { padding:8px 0 0; }
  .btn { width:100%; height:64px; border:none; border-radius:16px; font-family:var(--sans);
         font-size:22px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--cyan); color:var(--oncyan); box-shadow:0 0 26px rgba(0,242,255,.35); }
  .btn.caution { background:var(--orange); color:var(--onorange); box-shadow:0 0 26px rgba(255,149,0,.40); }
  .split { display:flex; width:100%; height:64px; border-radius:16px; overflow:hidden;
           box-shadow:0 0 26px rgba(0,242,255,.35); }
  .split .half { flex:1; border:none; background:var(--cyan); color:var(--oncyan); font-size:22px;
                 font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .split .half:first-child { border-right:2px solid rgba(0,54,58,.4); }

  footer { margin-top:24px; padding-bottom:8px; min-height:96px; }
  .conn { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; letter-spacing:.5px; }
  .conn.online { color:var(--cyan); } .conn.offline { color:var(--mut); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--red); }
  .dot.on { background:var(--green); }
  .log { margin-top:8px; }
  .log div { font-family:var(--mono); font-size:11px; color:rgba(185,202,203,.55); padding-left:18px; }

  /* settings modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.show { display:flex; }
  .sheet { background:var(--s2); border:1px solid var(--line); border-radius:16px; padding:20px; width:100%; max-width:420px; }
  .sheet h2 { margin:0 0 8px; font-size:20px; }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#13161a; color:var(--fg); font:inherit; }
  input:focus { outline:none; border-color:var(--cyan); }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .toggle { display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; }
  .muted { color:var(--mut); font-size:12px; margin-top:12px; }
  .sbtn { font:inherit; color:var(--fg); background:var(--s1); border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; }
  .sbtn.go { background:var(--cyan); color:var(--oncyan); border:none; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#00f2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 10.5 L12 3.5 L21.5 10.5"/><path d="M5 10.5 L5 20.5 L19 20.5 L19 10.5"/><path d="M8 14 L16 14 M8 17 L16 17"/>
      </svg>
      <h1>GARAGE</h1>
    </div>
    <button class="gear" id="gear" title="Settings">⚙</button>
  </header>

  <div class="hero">
    <svg id="door" class="door s-closed" viewBox="0 0 200 170" aria-hidden="true">
      <defs><clipPath id="op"><rect x="40" y="20" width="120" height="120" rx="4"/></clipPath></defs>
      <rect x="40" y="20" width="120" height="120" fill="#0b0d10" stroke="#00f2ff" stroke-width="2" rx="4"/>
      <g class="panel" clip-path="url(#op)">
        <rect x="42" y="22" width="116" height="116" fill="#393939" rx="3"/>
        <line x1="42" y1="52" x2="158" y2="52" stroke="#2b2b2b" stroke-width="2"/>
        <line x1="42" y1="82" x2="158" y2="82" stroke="#2b2b2b" stroke-width="2"/>
        <line x1="42" y1="112" x2="158" y2="112" stroke="#2b2b2b" stroke-width="2"/>
      </g>
      <g class="chevs" stroke="#00f2ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline class="c1" points="88,58 100,49 112,58"/>
        <polyline class="c2" points="88,74 100,65 112,74"/>
        <polyline class="c3" points="88,90 100,81 112,90"/>
      </g>
      <path d="M40 140 L160 140 M55 165 L145 165 M40 140 L30 165 M160 140 L170 165 M100 140 L100 165"
            stroke="#00f2ff" stroke-opacity="0.18" stroke-width="1" fill="none"/>
    </svg>
    <div class="state closed" id="state">—</div>
    <div class="sub" id="sub">connecting…</div>
    <div class="stamp" id="stamp"><b>DEMO</b><span>SIMULATED · NO BROKER</span></div>
  </div>

  <div class="action" id="action"></div>

  <footer>
    <div class="conn offline" id="connRow"><span class="dot" id="dot"></span><span id="conn">offline</span></div>
    <div class="log" id="log"></div>
  </footer>
</div>

<div class="modal" id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <div class="toggle">
      <div><div>Demo mode</div><div class="muted" style="margin:0">Simulated — no broker</div></div>
      <input type="checkbox" id="s_demo" style="width:auto" />
    </div>
    <label>Cloud broker host (EMQX)</label><input id="s_host" placeholder="xxxx.emqxsl.com" />
    <div class="row">
      <div><label>Username</label><input id="s_user" /></div>
      <div><label>Password</label><input id="s_pass" type="password" /></div>
    </div>
    <div class="row">
      <div><label>Monitor id (i4)</label><input id="s_mon" placeholder="garage-monitor" /></div>
      <div><label>Controller id (S1)</label><input id="s_ctrl" placeholder="garage-controller" /></div>
    </div>
    <p class="muted">Credentials stay in this browser (localStorage). Web control uses the cloud broker;
      the phone app handles same-Wi-Fi direct + local broker. Notifications/alarms are app-only.</p>
    <div class="row" style="margin-top:14px;">
      <button class="sbtn go" id="s_save">Save &amp; reconnect</button>
      <button class="sbtn" id="s_close">Close</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="garage-core.js"></script>
<script>
(function () {
  "use strict";
  var G = window.GarageCore, LS = window.localStorage;
  var cfg = {
    host: LS.getItem("gh_host") || "", user: LS.getItem("gh_user") || "", pass: LS.getItem("gh_pass") || "",
    mon: LS.getItem("gh_mon") || G.DEFAULTS.monitorId, ctrl: LS.getItem("gh_ctrl") || G.DEFAULTS.controllerId,
    demo: LS.getItem("gh_demo") === "1",
  };
  var client = null, topics = null, door = null, connected = false, lastRx = 0, log = [], demo = null;
  var $ = function (id) { return document.getElementById(id); };
  function nowSec() { return Math.floor(Date.now() / 1000); }
  function hhmm() { return new Date().toLocaleTimeString(); }

  var DOOR_CLASS = {
    CLOSED: "s-closed", OPEN: "s-open", OPENING: "s-opening", CLOSING: "s-closing",
    STOPPED_OPENING: "s-stopped", STOPPED_CLOSING: "s-stopped", UNKNOWN: "s-unknown"
  };

  function render() {
    var st = door ? door.state : null;
    // door graphic: CSS drives panel position + opening/closing animation off this state class
    $("door").setAttribute("class", "door " + (DOOR_CLASS[st] || "s-unknown"));

    var stateEl = $("state");
    stateEl.textContent = door ? G.shortLabel(st) : "—";
    stateEl.className = "state" + (G.isStopped(st) ? " stopped" : "");

    var sub;
    if (cfg.demo) sub = subFor(st);
    else if (door) sub = subFor(st);
    else if (connected) sub = "waiting for device…";
    else sub = cfg.host ? "not connected" : "set credentials (⚙)";
    $("sub").textContent = sub;
    $("stamp").className = "stamp" + (cfg.demo ? " on" : "");

    renderAction(st);

    var online = cfg.demo || connected;
    $("connRow").className = "conn " + (online ? "online" : "offline");
    $("dot").className = "dot" + (online ? " on" : "");
    var mode = cfg.demo ? "DEMO" : connected ? "CLOUD" : "OFFLINE";
    var fresh = cfg.demo ? "live" : connected ? ("updated " + (lastRx ? new Date(lastRx * 1000).toLocaleTimeString() : "—")) : "—";
    $("conn").textContent = (G.connLabel(mode) + " · " + fresh).toUpperCase();
    var logEl = $("log"); logEl.innerHTML = "";
    log.slice(0, 4).forEach(function (e) { var d = document.createElement("div"); d.textContent = e.time + "  " + G.connLabel(e.mode); logEl.appendChild(d); });
  }

  function subFor(st) {
    if (!st) return "—";
    if (st === "OPENING" || st === "CLOSING") return "in motion";
    if (st === "STOPPED_OPENING") return "while opening";
    if (st === "STOPPED_CLOSING") return "while closing";
    return "for " + G.fmtDur(G.durationSec(door, nowSec()));
  }

  function renderAction(st) {
    var acts = G.actionsFor(st), el = $("action"); el.innerHTML = "";
    if (G.isSplit(st) && acts.length === 2) {
      var box = document.createElement("div"); box.className = "split";
      acts.forEach(function (a) {
        var b = document.createElement("button"); b.className = "half"; b.textContent = a.arrow + " " + a.label;
        b.onclick = function () { send(a.cmd); }; box.appendChild(b);
      });
      el.appendChild(box);
    } else {
      var a = acts[0], b = document.createElement("button");
      b.className = "btn " + a.tone; b.textContent = (a.arrow ? a.arrow + " " : "") + a.label;
      b.onclick = function () { send(a.cmd); }; el.appendChild(b);
    }
  }

  function setMode(mode) { log = G.pushLog(log, mode, hhmm()); }

  function send(cmd) {
    if (cfg.demo) { demo.command(cmd, Date.now()); door = demo.door(Date.now()); render(); return; }
    var c = G.buildCommand(cmd);
    if (!c || !client || !connected) return;
    client.publish(topics.command, c, { qos: 1 });
  }

  function connect() {
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    connected = false; door = null;
    if (cfg.demo) { demo = demo || G.createDemo(); door = demo.door(Date.now()); setMode("DEMO"); render(); return; }
    demo = null;
    if (!cfg.host || !cfg.user) { render(); return; }
    topics = G.topics(cfg.mon, cfg.ctrl);
    setMode("OFFLINE"); render();
    client = mqtt.connect(G.brokerUrl(cfg.host), {
      username: cfg.user, password: cfg.pass, clean: true,
      reconnectPeriod: 4000, connectTimeout: 8000, clientId: G.randomClientId(),
    });
    client.on("connect", function () { connected = true; setMode("CLOUD"); client.subscribe(topics.state, { qos: 1 }); render(); });
    client.on("close", function () { connected = false; setMode("OFFLINE"); render(); });
    client.on("offline", function () { connected = false; setMode("OFFLINE"); render(); });
    client.on("message", function (t, payload) {
      if (t === topics.state) { var d = G.parseDoor(payload.toString()); if (d) { door = d; lastRx = nowSec(); render(); } }
    });
  }

  function openSettings() {
    $("s_demo").checked = cfg.demo; $("s_host").value = cfg.host; $("s_user").value = cfg.user;
    $("s_pass").value = cfg.pass; $("s_mon").value = cfg.mon; $("s_ctrl").value = cfg.ctrl;
    $("settings").classList.add("show");
  }
  $("gear").onclick = openSettings;
  $("s_close").onclick = function () { $("settings").classList.remove("show"); };
  $("s_save").onclick = function () {
    cfg.demo = $("s_demo").checked;
    cfg.host = $("s_host").value.trim(); cfg.user = $("s_user").value.trim(); cfg.pass = $("s_pass").value;
    cfg.mon = $("s_mon").value.trim() || G.DEFAULTS.monitorId; cfg.ctrl = $("s_ctrl").value.trim() || G.DEFAULTS.controllerId;
    LS.setItem("gh_demo", cfg.demo ? "1" : "0");
    LS.setItem("gh_host", cfg.host); LS.setItem("gh_user", cfg.user); LS.setItem("gh_pass", cfg.pass);
    LS.setItem("gh_mon", cfg.mon); LS.setItem("gh_ctrl", cfg.ctrl);
    $("settings").classList.remove("show"); connect();
  };

  setInterval(function () { if (cfg.demo && demo) door = demo.door(Date.now()); render(); }, 1000);
  if (!cfg.demo && (!cfg.host || !cfg.user)) openSettings();
  connect();
})();
</script>
</body>
</html>
