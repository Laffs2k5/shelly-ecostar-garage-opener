name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 for JS actions ahead of GitHub's default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  js-tests:
    name: JS tests (device + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Device logic tests (mocked Shelly runtime)
        run: node --test 'device/test/*.test.js'
      - name: Web logic tests
        run: node --test 'web/test/*.test.js'
      - name: Minified device artifacts are fresh
        run: bash scripts/build-device.sh --check
      - name: Wear shared-logic in sync with the phone app
        run: bash scripts/check-wear-sync.sh

  android:
    name: Android (phone + watch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Both modules sign debug with the committed debug.keystore (stable + shared) — no secret needed.
      - name: Phone — unit tests + assemble debug
        working-directory: app
        run: |
          gradle wrapper
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Watch — assemble debug
        working-directory: wear
        run: |
          gradle wrapper
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Verify phone + watch share the signing cert (Wear Data Layer pairing)
        run: |
          set -euo pipefail
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          PHONE=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          WATCH=$(ls wear/build/outputs/apk/debug/*.apk | head -1)
          echo "phone:"; "$SIGNER" verify --print-certs "$PHONE" | grep -iE 'SHA-256 digest'
          echo "watch:"; "$SIGNER" verify --print-certs "$WATCH" | grep -iE 'SHA-256 digest'

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
