name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Tag vX.Y.Z[-pre] -> APK versionName=X.Y.Z[-pre], versionCode=X*10000+Y*100+Z (monotonic).
      # build.gradle.kts reads these from the env; absent (local builds) it keeps its dev default.
      - name: Derive version from tag (semver)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CORE="${TAG%%-*}"; IFS=. read -r MA MI PA <<< "$CORE"
          CODE=$(( ${MA:-0}*10000 + ${MI:-0}*100 + ${PA:-0} ))
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Release $GITHUB_REF_NAME -> versionName=$TAG versionCode=$CODE"

      # Both modules sign with the committed debug.keystore (stable + shared) — no secret needed.
      - name: Build phone debug APK
        working-directory: app
        run: |
          gradle wrapper
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Build watch debug APK
        working-directory: wear
        run: |
          gradle wrapper
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Generate changelog
        id: notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "Initial release."
            else
              echo "## What's changed since ${PREVIOUS_TAG}"
              echo ""
              for type_label in "feat:Features" "fix:Bug Fixes" "docs:Documentation" "test:Tests" "refactor:Refactoring" "build:Build" "chore:Maintenance"; do
                prefix="${type_label%%:*}"
                label="${type_label##*:}"
                # match "type:" AND "type(scope):" (conventional-commit scopes), stripping either form
                COMMITS=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${{ github.ref_name }}" | grep -E "^- ${prefix}(\(.+\))?: " | sed -E "s/^- ${prefix}(\(.+\))?: /- /" || true)
                if [ -n "$COMMITS" ]; then
                  echo "### ${label}"; echo "$COMMITS"; echo ""
                fi
              done
              echo "**Full diff:** [\`${PREVIOUS_TAG}...${{ github.ref_name }}\`](https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }})"
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
