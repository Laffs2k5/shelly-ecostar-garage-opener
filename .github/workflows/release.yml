name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode + validate debug keystore (NEW-PROJECT-GUIDE §8)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE:-}" ]; then
            echo "::error::DEBUG_KEYSTORE secret is required for releases (stable signing). Set it: base64 -w0 debug.keystore"
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: app
        run: gradle wrapper

      - name: Build debug APK
        working-directory: app
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Generate changelog
        id: notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "Initial release."
            else
              echo "## What's changed since ${PREVIOUS_TAG}"
              echo ""
              for type_label in "feat:Features" "fix:Bug Fixes" "docs:Documentation" "test:Tests" "refactor:Refactoring" "build:Build" "chore:Maintenance"; do
                prefix="${type_label%%:*}"
                label="${type_label##*:}"
                COMMITS=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${{ github.ref_name }}" | grep "^- ${prefix}:" | sed "s/^- ${prefix}: /- /" || true)
                if [ -n "$COMMITS" ]; then
                  echo "### ${label}"; echo "$COMMITS"; echo ""
                fi
              done
              echo "**Full diff:** [\`${PREVIOUS_TAG}...${{ github.ref_name }}\`](https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }})"
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
